name: simplybox-rag-app
region: sgp1

services:
    - name: web
      git:
          repo_clone_url: SimplyBox/RAG
          branch: main
          deploy_on_push: true
      dockerfile_path: Dockerfile
      http_port: 8000
      instance_size_slug: basic-xs
      instance_count: 1
      health_check:
          http_path: /health
      routes:
          - path: /
      envs:
          - key: PINECONE_API_KEY
            scope: RUN_TIME
            value: ${PINECONE_API_KEY}
          - key: GROQ_API_KEY
            scope: RUN_TIME
            value: ${GROQ_API_KEY}
          - key: PORT
            scope: RUN_TIME
            value: "8000"

    - name: shell
      run_command: sleep infinity
      
routes:
    - path: /
      service_name: web
